services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketing}
      POSTGRES_USER: ${POSTGRES_USER:-marketing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketing}
    volumes:
      - marketing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketing -d marketing"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://marketing:marketing@db:5432/marketing}
      SOCIAL_MODE: ${SOCIAL_MODE:-simulation}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8002}
      INSTAGRAM_USER_ID: ${INSTAGRAM_USER_ID:-}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      INSTAGRAM_GRAPH_VERSION: ${INSTAGRAM_GRAPH_VERSION:-v26.0}
    ports:
      - "8002:8000"
    volumes:
      - marketing_assets:/app/storage
    depends_on:
      db:
        condition: service_healthy
volumes:
  marketing_data:
  marketing_assets:

